<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4b3d68">
<title>格莉奇遊樂園・抓娃娃機</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%239375cf'/%3E%3Cpath d='M17 17h30v25H17zM23 11v6m18-6v6M24 28h4m8 0h4M27 36h10' stroke='%23dffbf8' stroke-width='4' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<link rel="modulepreload" href="./vendor/three.module.min.js">
<link rel="preload" href="./assets/glitch-atlas.webp" as="image" type="image/webp">
<link rel="preload" href="./assets/avatar-atlas.webp" as="image" type="image/webp">
<style>
  :root{--ink:#453a5e;--dim:#776d94;--paper:#f7f5fb;--violet:#9375cf;--mint:#65d6cd;--line:#c9c2df}
  *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100b1b;color:var(--ink);font:14px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  canvas{display:block;touch-action:none} button{font:inherit;cursor:pointer}
  #ui{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:space-between;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));pointer-events:none}
  #ui>*{pointer-events:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.brand{display:flex;align-items:center;gap:9px}.brand h1{margin:0;color:#f7f5fb;font-size:16px;letter-spacing:.06em;text-shadow:0 0 12px rgba(101,230,218,.42)}.brand small{display:block;color:#b9add5;font-size:11px;font-weight:400;letter-spacing:.04em}
  .ghost{border:1px solid rgba(185,173,213,.48);border-radius:8px;background:rgba(28,18,43,.82);color:#eee9fa;padding:6px 10px;backdrop-filter:blur(7px)}
  .topTools{display:flex;align-items:flex-start;gap:10px}.sound{white-space:nowrap}
  #progress{display:flex;gap:7px;cursor:pointer;border-radius:10px}#progress:focus-visible{outline:2px solid var(--mint);outline-offset:4px}.prizeSlot{width:62px;height:62px;border-radius:50%;overflow:hidden;border:2px solid #665a7d;background:rgba(28,18,43,.9);display:grid;place-items:center;color:#a89bc4;font-size:19px;box-shadow:0 0 15px rgba(101,230,218,.12)}.prizeSlot.has{border-color:var(--mint);box-shadow:0 0 0 3px rgba(101,230,218,.16),0 0 18px rgba(101,230,218,.3)}.avatarSprite{display:block;width:100%;height:100%;background-image:url("./assets/avatar-atlas.webp");background-repeat:no-repeat;background-size:400% 200%;background-position:var(--avatar-x) var(--avatar-y)}
  .bottom{display:flex;align-items:flex-end;justify-content:flex-start}.status{max-width:390px;border:1px solid rgba(101,230,218,.34);border-radius:9px;padding:7px 11px;background:rgba(28,18,43,.86);color:#d8d0e9;box-shadow:0 0 18px rgba(101,230,218,.1);backdrop-filter:blur(8px)}
  #reveal{position:fixed;inset:0;z-index:5;display:none;place-items:center;background:rgba(38,29,57,.66);padding:20px}#reveal.on{display:grid}.revealCard{width:min(360px,90vw);padding:18px 18px 16px;border-radius:18px;background:var(--paper);text-align:center;box-shadow:0 24px 70px rgba(27,20,43,.42);animation:pop .46s cubic-bezier(.2,.9,.25,1.2)}.revealAvatar{width:150px;height:150px;margin:0 auto;border-radius:50%;border:5px solid #fff;box-shadow:0 7px 25px rgba(69,58,94,.2)}.revealCard .eyebrow{color:var(--violet);font-size:11px;letter-spacing:.24em}.revealCard h2{margin:8px 0 2px;font-size:25px}.revealCard p{margin:0 0 14px;color:var(--dim)}.revealCard button{border:0;border-radius:9px;padding:9px 24px;background:var(--violet);color:#fff}.missIcon{position:relative;width:84px;height:70px;margin:0 auto}.missIcon::before,.missIcon::after{content:"";position:absolute;border:4px solid var(--mint);border-radius:50%;background:rgba(101,214,205,.12)}.missIcon::before{width:48px;height:48px;left:8px;top:15px}.missIcon::after{width:24px;height:24px;right:5px;top:3px}@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.86)}}
  #collection{position:fixed;inset:0;z-index:6;display:grid;place-items:center;background:rgba(38,29,57,.58);padding:20px}#collection[hidden]{display:none}.collectionCard{width:min(370px,92vw);max-height:78vh;overflow:auto;border-radius:16px;background:var(--paper);padding:16px 18px;box-shadow:0 24px 70px rgba(27,20,43,.42)}.collectionHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:700}.collectionHead button{border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--dim);padding:3px 10px}.collectionRow{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}.collectionRow:last-child{border-bottom:0}.collectionAvatar{width:46px;height:46px;flex:0 0 46px;border-radius:50%;border:1px solid var(--line)}.collectionName{font-weight:700}.collectionType,.collectionEmpty{color:var(--dim);font-size:12px}.collectionEmpty{padding:12px 0}
  #shade{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 72% 72% at 50% 47%,transparent 42%,rgba(5,2,11,.58))}
  @media(max-width:660px){#ui{padding:10px}.brand h1{font-size:14px}.topTools{max-width:62vw;flex-direction:column;align-items:flex-end;gap:5px}.sound{padding:3px 8px;font-size:11px}#progress{max-width:62vw;flex-wrap:wrap;justify-content:flex-end;gap:5px}.prizeSlot{width:50px;height:50px;font-size:16px}.status{max-width:none;font-size:12px;padding:5px 9px}}
  @media(prefers-reduced-motion:reduce){.revealCard{animation:none}}
</style>
</head>
<body>
<div id="shade"></div>
<div id="ui">
  <div class="top">
    <div class="brand"><button id="exit" class="ghost" hidden>← 離開</button><h1>抓娃娃機<small>格莉奇遊樂園</small></h1></div>
    <div class="topTools">
      <button id="sound" class="ghost sound" type="button" aria-pressed="false">聲音：開</button>
      <div id="progress" role="button" tabindex="0" aria-label="查看收集進度"></div>
    </div>
  </div>
  <div class="bottom">
    <div id="status" class="status" aria-live="polite">請先點擊機台上的「投幣孔」。</div>
  </div>
</div>
<div id="reveal" aria-live="assertive"></div>
<div id="collection" hidden>
  <div class="collectionCard" role="dialog" aria-modal="true" aria-label="收集清單">
    <div class="collectionHead"><span id="collectionTitle">收集進度</span><button id="collectionClose" type="button">關閉</button></div>
    <div id="collectionList"></div>
  </div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
