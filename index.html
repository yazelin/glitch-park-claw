<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4b3d68">
<title>格莉奇遊樂園・抓娃娃機</title>
<style>
  :root{--ink:#453a5e;--dim:#776d94;--paper:#f7f5fb;--violet:#9375cf;--mint:#65d6cd;--line:#c9c2df}
  *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ddd8ee;color:var(--ink);font:14px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  canvas{display:block;touch-action:none} button{font:inherit;cursor:pointer}
  #ui{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:space-between;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));pointer-events:none}
  #ui>*{pointer-events:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.brand{display:flex;align-items:center;gap:9px}.brand h1{margin:0;font-size:16px;letter-spacing:.06em}.brand small{display:block;color:var(--dim);font-size:11px;font-weight:400;letter-spacing:.04em}
  .ghost{border:1px solid var(--line);border-radius:8px;background:rgba(247,245,251,.78);color:var(--dim);padding:6px 10px;backdrop-filter:blur(7px)}
  #progress{display:flex;gap:5px;cursor:pointer;border-radius:8px}#progress:focus-visible{outline:2px solid var(--mint);outline-offset:4px}.prizeSlot{width:31px;height:31px;border-radius:50%;overflow:hidden;border:1px solid var(--line);background:rgba(247,245,251,.78);display:grid;place-items:center;color:#9b91b8;font-size:12px}.prizeSlot.has{border-color:var(--violet);box-shadow:0 0 0 2px rgba(147,117,207,.16)}.prizeSlot img{width:100%;height:100%;object-fit:cover}
  .bottom{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:14px}.status{justify-self:start;max-width:340px;border:1px solid rgba(201,194,223,.85);border-radius:9px;padding:7px 11px;background:rgba(247,245,251,.84);color:var(--dim);backdrop-filter:blur(8px)}
  .controls{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,45px);gap:5px;touch-action:none}.move,.drop{border:1px solid rgba(255,255,255,.55);border-radius:10px;color:#fff;background:rgba(69,58,94,.82);box-shadow:0 5px 15px rgba(45,35,68,.2);font-size:19px;user-select:none}.move:active,.move.active{transform:translateY(2px);background:var(--violet)}#forward{grid-column:2}#left{grid-row:2;grid-column:1}#back{grid-row:2;grid-column:2}#right{grid-row:2;grid-column:3}
  .drop{justify-self:end;width:92px;height:92px;border-radius:50%;font-size:14px;font-weight:700;letter-spacing:.08em;background:linear-gradient(#ef9e82,#d96f68);border:6px solid rgba(255,255,255,.65)}.drop:disabled,.move:disabled{opacity:.45;cursor:default}
  #reveal{position:fixed;inset:0;z-index:5;display:none;place-items:center;background:rgba(38,29,57,.66);padding:20px}#reveal.on{display:grid}.revealCard{width:min(360px,90vw);padding:18px 18px 16px;border-radius:18px;background:var(--paper);text-align:center;box-shadow:0 24px 70px rgba(27,20,43,.42);animation:pop .46s cubic-bezier(.2,.9,.25,1.2)}.revealCard img{width:150px;height:150px;object-fit:cover;border-radius:50%;border:5px solid #fff;box-shadow:0 7px 25px rgba(69,58,94,.2)}.revealCard .eyebrow{color:var(--violet);font-size:11px;letter-spacing:.24em}.revealCard h2{margin:8px 0 2px;font-size:25px}.revealCard p{margin:0 0 14px;color:var(--dim)}.revealCard button{border:0;border-radius:9px;padding:9px 24px;background:var(--violet);color:#fff}.missIcon{font-size:70px;line-height:1.2}@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.86)}}
  #collection{position:fixed;inset:0;z-index:6;display:grid;place-items:center;background:rgba(38,29,57,.58);padding:20px}#collection[hidden]{display:none}.collectionCard{width:min(370px,92vw);max-height:78vh;overflow:auto;border-radius:16px;background:var(--paper);padding:16px 18px;box-shadow:0 24px 70px rgba(27,20,43,.42)}.collectionHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:700}.collectionHead button{border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--dim);padding:3px 10px}.collectionRow{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}.collectionRow:last-child{border-bottom:0}.collectionRow img{width:46px;height:46px;object-fit:cover;border-radius:50%;border:1px solid var(--line)}.collectionName{font-weight:700}.collectionType,.collectionEmpty{color:var(--dim);font-size:12px}.collectionEmpty{padding:12px 0}
  #shade{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 72% 72% at 50% 47%,transparent 40%,rgba(52,41,78,.35))}
  @media(max-width:660px){#ui{padding:10px}.brand h1{font-size:14px}#progress{max-width:56vw;flex-wrap:wrap;justify-content:flex-end}.prizeSlot{width:25px;height:25px}.bottom{grid-template-columns:1fr auto;gap:8px}.status{grid-column:1/-1;grid-row:1;max-width:none;font-size:12px;padding:5px 9px}.controls{grid-column:1;grid-row:2;grid-template-columns:repeat(3,45px);grid-template-rows:repeat(2,40px)}.drop{grid-column:2;grid-row:2;width:78px;height:78px;border-width:5px}}
  @media(prefers-reduced-motion:reduce){.revealCard{animation:none}}
</style>
</head>
<body>
<div id="shade"></div>
<div id="ui">
  <div class="top">
    <div class="brand"><button id="exit" class="ghost" hidden>← 離開</button><h1>抓娃娃機<small>格莉奇遊樂園</small></h1></div>
    <div id="progress" role="button" tabindex="0" aria-label="查看收集進度"></div>
  </div>
  <div class="bottom">
    <div id="status" class="status" aria-live="polite">移動吊爪，對準娃娃後按下「抓取」。</div>
    <div class="controls" aria-label="移動吊爪">
      <button id="forward" class="move" data-dir="forward" aria-label="往前">▲</button>
      <button id="left" class="move" data-dir="left" aria-label="往左">◀</button>
      <button id="back" class="move" data-dir="back" aria-label="往後">▼</button>
      <button id="right" class="move" data-dir="right" aria-label="往右">▶</button>
    </div>
    <button id="drop" class="drop">抓取</button>
  </div>
</div>
<div id="reveal" aria-live="assertive"></div>
<div id="collection" hidden>
  <div class="collectionCard" role="dialog" aria-modal="true" aria-label="收集清單">
    <div class="collectionHead"><span id="collectionTitle">收集進度</span><button id="collectionClose" type="button">關閉</button></div>
    <div id="collectionList"></div>
  </div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
